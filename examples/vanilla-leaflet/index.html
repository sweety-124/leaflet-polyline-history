<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Polyline History - Vanilla demo</title>
  </head>
  <body>
    <main>
      <header class="toolbar">
        <strong>Polyline history</strong>
        <button id="add">Add route</button>
        <button id="edit" disabled>Edit route</button>
        <button id="delete" disabled>Delete route</button>
        <button id="undo" disabled>Undo</button>
        <button id="redo" disabled>Redo</button>
        <button id="clear" disabled>Clear history</button>
        <output id="status">Ready</output>
      </header>
      <div id="map" aria-label="Interactive map"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
